<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Logs - Excel Export</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      background: radial-gradient(circle at top, #0b1e30, #000);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px 0;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      color: #00eaff;
      text-shadow: 0 0 12px rgba(0, 234, 255, 0.6);
      letter-spacing: 1px;
      font-weight: 600;
      margin-top: 0;
      width: 100%;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      padding: 25px;
      border-radius: 18px;
      width: 90%;
      max-width: 1000px;
      max-height: 85vh;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 234, 255, 0.05);
      text-align: center;
      margin: 10px;
    }

    .date-picker {
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .date-picker label {
      font-size: 18px;
      font-weight: 500;
    }

    .date-picker input {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 16px;
    }

    .btn {
      display: inline-block;
      font-size: 16px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .button-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 20px 0;
      width: 100%;
      flex-wrap: wrap;
    }

    .btn.primary {
      background: linear-gradient(90deg, #00ff99, #00cc66);
      color: white;
      box-shadow: 0 0 8px rgba(0, 255, 153, 0.5);
    }

    .btn.primary:hover {
      box-shadow: 0 0 18px rgba(0, 255, 153, 0.8);
      transform: scale(1.03);
    }

    .btn.secondary {
      background: linear-gradient(90deg, #ff4747, #cc1b1b);
      color: white;
      box-shadow: 0 0 8px rgba(255, 71, 71, 0.5);
    }

    .btn.secondary:hover {
      box-shadow: 0 0 18px rgba(255, 71, 71, 0.8);
      transform: scale(1.03);
    }

    .table-wrapper {
      margin-top: 20px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 5px;
      scroll-behavior: smooth;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      background: rgba(0, 234, 255, 0.2);
      color: #00eaff;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    footer {
      margin-top: 10px;
      font-size: 14px;
      color: #aaa;
      opacity: 0.85;
      text-align: center;
      width: 100%;
    }
  </style>

</head>
<body>

  <div class="container">

    <h1>ESP32 Logs</h1>

    <div class="date-picker">
      <label>Select Date:</label>
      <input type="date" id="logDate">
    </div>

    <div class="button-group">
      <button class="btn primary" onclick="loadLogs()">Load Logs</button>
      <button class="btn primary" onclick="exportToExcel()">Export to Excel</button>
      <button class="btn secondary" onclick="window.location.href='index.html'">Back to Control</button>
    </div>

    <div class="table-wrapper">
      <table id="logsTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>LED State</th>
            <th>Brightness (%)</th>
            <th>Pot Value</th>
          </tr>
        </thead>
        <tbody id="logsBody"></tbody>
      </table>
    </div>

  </div>

  <footer>ESP32 Continuous Logging ⚡</footer>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLAKW51iGzR68EL-ZPWxraFz-NTdNJPqM",
      authDomain: "esp32ledcontrol-c0d28.firebaseapp.com",
      databaseURL: "https://esp32ledcontrol-c0d28-default-rtdb.firebaseio.com",
      projectId: "esp32ledcontrol-c0d28",
      storageBucket: "esp32ledcontrol-c0d28.appspot.com",
      messagingSenderId: "616534198261",
      appId: "1:616534198261:web:5c6848fdec9d01c9c6c2bc"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let logsData = [];

    // Helper: tries to convert different time formats to a local time string
    function convertToLocalTimeString(entry, selectedDate) {
      // 1) If there's a numeric timestamp (ms or seconds)
      if (entry.timestamp !== undefined && entry.timestamp !== null) {
        let ts = Number(entry.timestamp);
        // if likely seconds, convert to ms
        if (ts < 1e12) ts = ts * 1000;
        const d = new Date(ts);
        if (!isNaN(d.getTime())) return d.toLocaleTimeString();
      }

      // 2) If we have "HH:MM:SS" (no timezone) treat it as UTC time for the selected date
      if (entry.time && typeof entry.time === 'string') {
        // match hh:mm or hh:mm:ss
        const hmMatch = entry.time.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
        if (hmMatch) {
          // ensure a selectedDate exists (YYYY-MM-DD), fallback to today
          const datePart = selectedDate || new Date().toISOString().split('T')[0];
          // build ISO string and append Z to treat as UTC
          const seconds = hmMatch[3] ? hmMatch[3] : '00';
          const isoUtc = `${datePart}T${hmMatch[1].padStart(2,'0')}:${hmMatch[2]}:${seconds}Z`;
          const d = new Date(isoUtc); // parsed as UTC
          if (!isNaN(d.getTime())) return d.toLocaleTimeString();
        }
      }

      // 3) If entry.time looks like an ISO string, try parsing directly
      if (entry.time) {
        const d = new Date(entry.time);
        if (!isNaN(d.getTime())) return d.toLocaleTimeString();
      }

      // 4) fallback to raw value
      return entry.time !== undefined ? String(entry.time) : '';
    }

    window.loadLogs = () => {
      const date = document.getElementById('logDate').value;
      if (!date) {
        alert('Please select a date.');
        return;
      }

      const logsRef = ref(database, `logs/esp32/${date}`);

      onValue(logsRef, (snapshot) => {
        const data = snapshot.val();
        logsData = [];

        const tbody = document.getElementById('logsBody');
        tbody.innerHTML = '';

        if (data) {
          // If firebase returns an object of keys, sort by key if keys are timestamps or times
          const keys = Object.keys(data).sort();

          keys.forEach(key => {
            const entry = data[key];
            // compute localTime for display and for CSV export
            const localTime = convertToLocalTimeString(entry, date);

            // store a normalized object for CSV export later
            logsData.push({
              displayTime: localTime,
              ledState: entry.ledState ?? entry.led ?? entry.state ?? '',
              brightness: entry.brightness ?? entry.brigthness ?? entry.value ?? '',
              potValue: entry.potValue ?? entry.pot ?? entry.pot_value ?? ''
            });

            const row = tbody.insertRow();
            row.insertCell(0).textContent = localTime;
            row.insertCell(1).textContent = entry.ledState ?? entry.led ?? entry.state ?? '';
            row.insertCell(2).textContent = entry.brightness ?? entry.brigthness ?? entry.value ?? '';
            row.insertCell(3).textContent = entry.potValue ?? entry.pot ?? entry.pot_value ?? '';
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="4">No logs found for this date.</td></tr>';
        }

        /* -----------------------------------
           ✅ SMOOTH AUTO-SCROLL TO BOTTOM
        -------------------------------------*/
        const wrapper = document.querySelector('.table-wrapper');
        wrapper.scrollTo({
          top: wrapper.scrollHeight,
          behavior: "smooth"
        });

      }, (err) => {
        console.error('Error reading logs:', err);
        alert('Error reading logs. See console for details.');
      });
    };

    window.exportToExcel = () => {
      if (logsData.length === 0) {
        alert('No data to export. Load logs first.');
        return;
      }

      let csv = 'Time,LED State,Brightness (%),Pot Value\n';

      logsData.forEach(entry => {
        // escape commas/newlines if any field contains them
        const row = [
          entry.displayTime,
          entry.ledState,
          entry.brightness,
          entry.potValue
        ].map(cell => {
          if (cell === null || cell === undefined) return '';
          const str = String(cell);
          // if contains comma or newline, wrap in quotes and escape quotes
          if (/[,\n"]/.test(str)) {
            return '"' + str.replace(/"/g, '""') + '"';
          }
          return str;
        }).join(',');
        csv += row + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `esp32_logs_${document.getElementById('logDate').value}.csv`;
      a.click();

      URL.revokeObjectURL(url);
    };

    // default to today
    document.getElementById('logDate').value = new Date().toISOString().split('T')[0];
  </script>

</body>
</html>
